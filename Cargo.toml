[package]
name = "rustclamp-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Clamp execution-environment contracts, added only when a prototype requires them."
repository = "https://github.com/rustclamp/runtime"
license = "MIT OR Apache-2.0"
homepage = "https://rustclamp.com"
documentation = "https://docs.rs/rustclamp-runtime"
keywords = ["framework", "lifecycle", "runtime"]
categories = ["rust-patterns", "asynchronous"]
readme = "README.md"

[features]
default = []
tokio = ["dep:tokio"]
signal = ["tokio", "tokio/signal"]

[dependencies]
rustclamp-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.53.1", optional = true, default-features = false, features = ["rt-multi-thread", "time", "macros"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
