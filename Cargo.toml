[package]
name = "rustclamp-runtime"
version = "1.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Task supervision and application lifecycle for RustClamp, with an optional Tokio adapter."
repository = "https://github.com/rustclamp/runtime"
license = "MIT OR Apache-2.0"
homepage = "https://rustclamp.com"
documentation = "https://docs.rs/rustclamp-runtime"
keywords = ["framework", "lifecycle", "runtime"]
categories = ["rust-patterns", "asynchronous"]
readme = "README.md"

[features]
default = []
tokio = ["dep:tokio"]
signal = ["tokio", "tokio/signal"]
config = ["dep:serde"]
config-toml = ["config", "dep:toml"]

[dependencies]
rustclamp-core = { version = "1.0.0", path = "../core" }
serde = { version = "1.0.229", optional = true, default-features = false, features = ["std"] }
toml = { version = "1.1.6", optional = true, default-features = false, features = ["std", "serde", "parse"] }
tokio = { version = "1.53.1", optional = true, default-features = false, features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
